name: Scheduled booking

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Comma-separated session codes. Leave empty to use repository variable UPV_SESSION_CODES."
        required: false
        type: string
      dry_run:
        description: "Use true only for a dry-run test. Scheduled runs always reserve."
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  schedule:
    - cron: "0 10 * * SAT"
      timezone: "Europe/Madrid"

concurrency:
  group: upv-gym-booking
  cancel-in-progress: false

jobs:
  booking:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate GitHub secrets
        env:
          UPV_DNI: ${{ secrets.UPV_DNI }}
          UPV_PASSWORD: ${{ secrets.UPV_PASSWORD }}
        run: |
          missing=0
          if [ -z "$UPV_DNI" ]; then
            echo "::error::UPV_DNI is empty or unavailable. Create it as a repository Actions secret, not as a variable or Codespaces/Dependabot secret."
            missing=1
          fi
          if [ -z "$UPV_PASSWORD" ]; then
            echo "::error::UPV_PASSWORD is empty or unavailable. Create it as a repository Actions secret, not as a variable or Codespaces/Dependabot secret."
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Open: Settings > Secrets and variables > Actions > Secrets > Repository secrets"
            exit 2
          fi
          echo "Required repository secrets are available."

      - name: Install
        run: python -m pip install .

      - name: Run booking
        env:
          UPV_DNI: ${{ secrets.UPV_DNI }}
          UPV_PASSWORD: ${{ secrets.UPV_PASSWORD }}
          UPV_MAX_ATTEMPTS: "3"
          BOOKING_CODES: ${{ github.event.inputs.codes || vars.UPV_SESSION_CODES }}
          MANUAL_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="--reserve"
          elif [ "$MANUAL_DRY_RUN" = "true" ]; then
            MODE="--dry-run"
          else
            MODE="--reserve"
          fi

          echo "Running mode: $MODE"
          echo "Booking codes: ${BOOKING_CODES:-default env codes}"

          if [ -n "$BOOKING_CODES" ]; then
            upv-gym-booking "$MODE" --codes "$BOOKING_CODES" --attempts "$UPV_MAX_ATTEMPTS" --debug-dir action-debug -v
          else
            upv-gym-booking "$MODE" --attempts "$UPV_MAX_ATTEMPTS" --debug-dir action-debug -v
          fi

      - name: Upload booking debug artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booking-debug
          path: action-debug/
          if-no-files-found: ignore
